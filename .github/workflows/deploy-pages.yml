# deploy-pages.yml
# -----------------------------------------------------------------------------
# Publishes this repo to GitHub Pages every time main is updated. No build
# step -- the site is just the repo's plain HTML/JS/JSON files, served as-is.
# The game will be reachable at <pages-url>/game/, the admin tools at
# <pages-url>/admin/team-builder.html and <pages-url>/admin/item-builder.html.
# -----------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
