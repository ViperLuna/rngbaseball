<!--
  team-stats.html
  -----------------------------------------------------------------------------
  Reached by clicking a team in the standings on season.html. Shows that
  team's roster with season-to-date cumulative stats per player (from the
  current season save's seasonStats -- see season.js's mergeGameStatsIntoSeason),
  not just a single game's line, plus a read-only gear panel (season.js's
  fullGearMap -- works for any team, since a given player's gear only ever
  lives in one of opponentGear or equippedGear, never both). This doubles
  as a scouting view for opponents; there's no equip action here, that's
  loadouts.html and only ever applies to your own roster. Which team to
  show comes from the ?team= query string.
  -----------------------------------------------------------------------------
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#000000">
<title>rngbaseball</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #232326;
    --border: #3f3f46;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Lexend', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 640px; }
  .back-row { margin-bottom: 1rem; }
  .back-btn {
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .back-btn:hover { filter: brightness(0.95); }
  h1 { font-size: 1.4rem; margin-bottom: 1rem; }
  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    background: var(--panel);
    margin-bottom: 1rem;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.25rem 0.4rem; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  .slot-empty { color: var(--muted); }
  .rarity-Common { color: #71717a; }
  .rarity-Uncommon { color: #16a34a; }
  .rarity-Rare { color: #2563eb; }
  .rarity-Epic { color: #9333ea; }
  .rarity-Legendary { color: #d97706; }
  .rarity-Mythical { color: #dc2626; }
  </style>
</head>
<body>
<main>
  <div class="back-row"><button type="button" class="back-btn" onclick="window.location.href='season.html'">&larr; Season</button></div>
  <h1 id="title"></h1>
  <div class="panel">
    <table>
      <tr><th>Player</th><th>Pos</th><th>Slot 1</th><th>Slot 2</th></tr>
      <tbody id="gearBody"></tbody>
    </table>
  </div>
  <div class="panel">
    <table>
      <tr><th>Player</th><th>Pos</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>BB</th><th>K</th><th>R</th><th>AVG</th></tr>
      <tbody id="battingBody"></tbody>
    </table>
  </div>
  <div class="panel">
    <table>
      <tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>K</th><th>R</th><th>ERA</th></tr>
      <tbody id="pitchingBody"></tbody>
    </table>
  </div>
</main>

<script src="engine.js"></script>
<script src="season.js"></script>
<script>
  const save = getSave();
  if (!save || !save.seasonInProgress) window.location.href = "index.html";

  const params = new URLSearchParams(window.location.search);
  const teamName = params.get("team");

  async function load() {
    const res = await fetch("../data/teams.json");
    const data = await res.json();
    const team = data.teams.find(t => t.name === teamName);
    if (!team) { window.location.href = "season.html"; return; }

    document.title = `rngbaseball — ${team.name}`;
    document.getElementById("title").textContent = `${team.name}${team.name === save.yourTeam ? " (Your Team)" : ""}`;

    const gearMap = fullGearMap(save);
    document.getElementById("gearBody").innerHTML = team.lineup.map(p => {
      const slots = slotsForPosition(p.position);
      const gear = gearMap[p.name] || {};
      const cells = slots.map(slot => {
        const item = gear[slot];
        if (!item) return `<td class="slot-empty">${slot}: Empty</td>`;
        return `<td>${slot}: ${escapeHtml(item.name)} (${escapeHtml(formatStats(item))}) <span class="rarity-${item.rarity}">${item.rarity}</span></td>`;
      });
      return `<tr><td>${escapeHtml(p.name)}</td><td>${p.position}</td>${cells.join("")}</tr>`;
    }).join("");

    document.getElementById("battingBody").innerHTML = team.lineup.map(p => {
      const line = (save.seasonStats[p.name] || newStatLine()).batting;
      return `<tr>
        <td>${escapeHtml(p.name)}</td><td>${p.position}</td>
        <td>${line.AB}</td><td>${line.H}</td><td>${line.doubles}</td><td>${line.triples}</td><td>${line.HR}</td>
        <td>${line.BB}</td><td>${line.K}</td><td>${line.R}</td><td>${battingAverage(line).toFixed(3)}</td>
      </tr>`;
    }).join("");

    const pitcher = findPitcher(team);
    const pline = (save.seasonStats[pitcher.name] || newStatLine()).pitching;
    document.getElementById("pitchingBody").innerHTML = `<tr>
      <td>${escapeHtml(pitcher.name)}</td><td>${(pline.outs / 3).toFixed(1)}</td>
      <td>${pline.H}</td><td>${pline.BB}</td><td>${pline.K}</td><td>${pline.R}</td><td>${era(pline).toFixed(2)}</td>
    </tr>`;
  }

  function slotsForPosition(position) {
    return position === "P" ? ["Hat", "Glove", "Shoes"] : ["Bat", "Helmet", "Shoes"];
  }

  function formatStats(item) {
    return item.stats.map(s => `${s.stat} ${s.value >= 0 ? "+" : ""}${s.value}`).join(", ");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  load();
</script>
</body>
</html>
