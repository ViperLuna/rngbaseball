<!--
  store.html
  -----------------------------------------------------------------------------
  The gacha store. Reached from the "Store" button on season.html. Spends
  Basebux (season.js's meta-save) on one of two crate types (season.js's
  CRATES: Basic and Advanced -- same six rarities in both, Advanced just
  skews the odds hard toward the top end). Opening a crate rolls a rarity
  via season.js's rollRarity(), then picks a uniformly random item of that
  rarity from items.json and adds it to the meta-save's inventory.

  Pulled items aren't equippable yet -- getBatterRatings()/getPitcherRatings()
  in engine.js are still flat baseline until the gear system gets wired into
  actual gameplay. This page is just the earn-and-collect side of that loop.
  -----------------------------------------------------------------------------
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#000000">
<title>rngbaseball</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #232326;
    --border: #3f3f46;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Lexend', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 640px; }
  .back-row { margin-bottom: 1rem; }
  .back-btn {
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .back-btn:hover { filter: brightness(0.95); }
  h1 { font-size: 1.4rem; margin: 0 0 0.1rem; }
  .balance { font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; }
  .crates { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .crate-card {
    flex: 1;
    min-width: 220px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    background: var(--panel);
  }
  .crate-card h2 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  .crate-price { color: var(--muted); margin-bottom: 0.6rem; }
  table.odds-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 0.75rem; }
  table.odds-table td { padding: 0.15rem 0; }
  table.odds-table td:last-child { text-align: right; color: var(--muted); }
  button {
    padding: 0.6rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--panel); color: var(--text); border-color: var(--border); }
  .sort-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .sort-row select {
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .sort-row button { width: auto; padding: 0.3rem 0.6rem; font-size: 0.85rem; }
  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    background: var(--panel);
    margin-bottom: 1rem;
    overflow-x: auto;
  }
  .pull-result { font-weight: 700; font-size: 1.1rem; text-align: center; padding: 0.5rem 0; }
  .rarity-Common { color: #71717a; }
  .rarity-Uncommon { color: #16a34a; }
  .rarity-Rare { color: #2563eb; }
  .rarity-Epic { color: #9333ea; }
  .rarity-Legendary { color: #d97706; }
  .rarity-Mythical { color: #dc2626; }
  #inventoryList { max-height: 30vh; overflow-y: auto; }
  table.inventory-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.inventory-table th, table.inventory-table td { text-align: left; padding: 0.25rem 0.4rem; }
  table.inventory-table th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  h2.section { font-size: 1.05rem; margin: 0 0 0.5rem; }
  </style>
</head>
<body>
<main>
  <div class="back-row"><button type="button" class="back-btn" onclick="window.location.href='season.html'">&larr; Season</button></div>
  <h1>Store</h1>
  <div class="balance" id="balance"></div>

  <div class="crates" id="crates"></div>

  <div class="panel" id="pullResult" style="display:none;"></div>

  <div class="panel">
    <h2 class="section">Inventory</h2>
    <div class="sort-row">
      <label for="sortKey">Sort by</label>
      <select id="sortKey">
        <option value="order">Order Gained</option>
        <option value="rarity">Rarity</option>
        <option value="name">Name</option>
      </select>
      <button type="button" class="secondary" id="sortDirBtn"></button>
    </div>
    <div id="inventoryList"></div>
  </div>
</main>

<script src="season.js"></script>
<script>
  let items = [];
  const RARITY_ORDER = Object.keys(CRATES.basic.odds);
  let sortKey = "order";
  let sortDirection = "desc"; // matches the previous fixed "newest first" behavior

  async function load() {
    const res = await fetch("../data/items.json");
    const data = await res.json();
    items = data.items;
    ensureInstanceIds();
    renderBalance();
    renderCrates();
    renderInventory();

    document.getElementById("sortKey").addEventListener("change", (e) => {
      sortKey = e.target.value;
      renderInventory();
    });
    document.getElementById("sortDirBtn").addEventListener("click", () => {
      sortDirection = sortDirection === "asc" ? "desc" : "asc";
      renderInventory();
    });
  }

  function sortedInventory(inventory) {
    const withOrder = inventory.map((item, idx) => ({ item, idx }));
    const dir = sortDirection === "asc" ? 1 : -1;
    withOrder.sort((a, b) => {
      if (sortKey === "rarity") return dir * (RARITY_ORDER.indexOf(a.item.rarity) - RARITY_ORDER.indexOf(b.item.rarity));
      if (sortKey === "name") return dir * a.item.name.localeCompare(b.item.name);
      return dir * (a.idx - b.idx);
    });
    return withOrder.map(x => x.item);
  }

  function sortDirLabel() {
    if (sortKey === "rarity") return sortDirection === "asc" ? "Common first" : "Mythical first";
    if (sortKey === "name") return sortDirection === "asc" ? "A -> Z" : "Z -> A";
    return sortDirection === "asc" ? "Oldest first" : "Newest first";
  }

  // Retrofits an _instanceId onto any inventory item that predates this
  // change (from before crate pulls started tagging one at pull time).
  function ensureInstanceIds() {
    const meta = getMeta();
    let changed = false;
    meta.inventory.forEach(item => {
      if (!item._instanceId) { item._instanceId = makeInstanceId(); changed = true; }
    });
    if (changed) setMeta(meta);
  }

  function makeInstanceId() {
    return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }

  function formatStats(item) {
    return item.stats.map(s => `${s.stat} ${s.value >= 0 ? "+" : ""}${s.value}`).join(", ");
  }

  function renderBalance() {
    const meta = getMeta();
    document.getElementById("balance").textContent = `Basebux: ${meta.basebux}`;
  }

  function renderCrates() {
    const meta = getMeta();
    document.getElementById("crates").innerHTML = Object.entries(CRATES).map(([key, crate]) => `
      <div class="crate-card">
        <h2>${escapeHtml(crate.label)}</h2>
        <div class="crate-price">${crate.price} Basebux &middot; ${ITEMS_PER_CRATE} items per crate</div>
        <table class="odds-table">
          ${Object.entries(crate.odds).map(([rarity, pct]) => `
            <tr><td class="rarity-${rarity}">${rarity}</td><td>${(pct * 100).toFixed(1)}%</td></tr>
          `).join("")}
        </table>
        <button data-crate="${key}" ${meta.basebux < crate.price ? "disabled" : ""}>Buy</button>
      </div>
    `).join("");
    document.querySelectorAll("#crates button").forEach(btn => {
      btn.addEventListener("click", () => buyCrate(btn.dataset.crate));
    });
  }

  function buyCrate(crateKey) {
    const crate = CRATES[crateKey];
    const meta = getMeta();
    if (meta.basebux < crate.price) return;

    meta.basebux -= crate.price;
    const pulled = [];
    for (let i = 0; i < ITEMS_PER_CRATE; i++) {
      const rarity = rollRarity(crateKey);
      const candidates = items.filter(i => i.rarity === rarity);
      const template = candidates[Math.floor(Math.random() * candidates.length)];
      // Clone (not the shared items.json template object) and tag with a
      // stable per-copy id -- loadouts.html needs a handle that survives
      // reordering when other items get equipped/sold, since two pulls of
      // the exact same item would otherwise be indistinguishable.
      const item = { ...template, _instanceId: makeInstanceId() };
      meta.inventory.push(item);
      pulled.push({ rarity, item });
    }
    setMeta(meta);

    document.getElementById("pullResult").style.display = "block";
    document.getElementById("pullResult").innerHTML = `
      <div style="text-align:center; font-weight:600; margin-bottom:0.4rem;">${escapeHtml(crate.label)} → ${pulled.length} items</div>
      ${pulled.map(({ rarity, item }) => `
        <div class="pull-result rarity-${rarity}">${rarity}: ${escapeHtml(item.name)} ${escapeHtml(item.slot)}</div>
        <div style="text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:0.5rem;">${escapeHtml(item.type)} · ${escapeHtml(item.slot)} · ${escapeHtml(formatStats(item))}</div>
      `).join("")}
    `;

    renderBalance();
    renderCrates();
    renderInventory();
  }

  function renderInventory() {
    const meta = getMeta();
    document.getElementById("sortKey").value = sortKey;
    document.getElementById("sortDirBtn").textContent = sortDirLabel();

    const inventoryList = document.getElementById("inventoryList");
    if (meta.inventory.length === 0) {
      inventoryList.innerHTML = `<p style="color:var(--muted); font-size:0.9rem;">No items yet -- open a crate to start collecting gear.</p>`;
      return;
    }
    const rows = sortedInventory(meta.inventory);
    inventoryList.innerHTML = `
      <table class="inventory-table">
        <tr><th>Item</th><th>Type</th><th>Slot</th><th>Stat</th><th>Rarity</th></tr>
        ${rows.map(item => `
          <tr>
            <td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.type)}</td>
            <td>${escapeHtml(item.slot)}</td>
            <td>${escapeHtml(formatStats(item))}</td>
            <td class="rarity-${item.rarity}">${item.rarity}</td>
          </tr>
        `).join("")}
      </table>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  load();
</script>
</body>
</html>
