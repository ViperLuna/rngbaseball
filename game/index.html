<!--
  index.html
  -----------------------------------------------------------------------------
  Main menu -- the actual entry point for rngbaseball, no separate splash
  screen. Reads a minimal localStorage flag to decide Start vs Continue
  Season and whether New Season should even be shown. Buttons that aren't
  currently relevant are removed from the layout entirely (not disabled),
  so the remaining ones just reflow.

  "Start Season" (no season saved yet) goes to team-select.html to pick a
  team and generate the season's round-robin schedule (schedule.js).
  "Continue Season" (a season already exists) currently just drops you into
  play.html (the single-instant-game test screen) as a placeholder -- that
  gets swapped for the real season loop (schedule, standings, playoff)
  later without needing to touch this menu.
  -----------------------------------------------------------------------------
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rngbaseball</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --panel: #ffffff;
    --border: #d4d4d8;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  main {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 2rem;
  }
  #menuButtons {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  button {
    padding: 0.75rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
  }
  button:hover { filter: brightness(0.95); }
  button.secondary {
    background: var(--panel);
    color: var(--text);
    border-color: var(--border);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #232326;
      --border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
  }
</style>
</head>
<body>
<main>
  <h1>rngbaseball</h1>
  <div id="menuButtons">
    <button id="seasonBtn" type="button"></button>
    <button id="newSeasonBtn" type="button" class="secondary" style="display:none;">New Season</button>
    <button id="loadoutsBtn" type="button" class="secondary">Loadouts</button>
  </div>
</main>

<script>
  const SAVE_KEY = "rngbaseball_save";

  function getSave() {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  }
  function setSave(data) {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }
  function clearSave() {
    localStorage.removeItem(SAVE_KEY);
  }

  const seasonBtn = document.getElementById("seasonBtn");
  const newSeasonBtn = document.getElementById("newSeasonBtn");
  const loadoutsBtn = document.getElementById("loadoutsBtn");

  function render() {
    const save = getSave();
    const hasSeason = !!(save && save.seasonInProgress);
    seasonBtn.textContent = hasSeason ? "Continue Season" : "Start Season";
    newSeasonBtn.style.display = hasSeason ? "block" : "none";
  }

  seasonBtn.addEventListener("click", () => {
    const save = getSave();
    if (save && save.seasonInProgress) {
      window.location.href = "play.html";
    } else {
      window.location.href = "team-select.html";
    }
  });

  newSeasonBtn.addEventListener("click", () => {
    const confirmed = confirm("Start a new season? This erases your current season's progress.");
    if (!confirmed) return;
    clearSave();
    render();
  });

  loadoutsBtn.addEventListener("click", () => {
    alert("Loadouts isn't built yet -- coming soon.");
  });

  render();
</script>
</body>
</html>
