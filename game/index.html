<!--
  index.html
  -----------------------------------------------------------------------------
  Main menu -- the actual entry point for rngbaseball, no separate splash
  screen. Reads a minimal localStorage flag to decide Start vs Continue
  Season and whether New Season should even be shown. Buttons that aren't
  currently relevant are removed from the layout entirely (not disabled),
  so the remaining ones just reflow.

  "Start Season" (no season saved yet) goes to league-select.html to pick
  a league, then team-select.html to pick a team and generate the season.
  "Continue Season" (a season already exists) goes to the season hub
  (season.html): standings, game history, and playing out the schedule.

  "New Season" wipes the current season save but keeps league-unlock
  progress (the separate meta-save in season.js). "Fresh Start" wipes both
  -- a full reset back to Rookie league only -- for whenever the player
  wants to start completely over.
  -----------------------------------------------------------------------------
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rngbaseball</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --panel: #ffffff;
    --border: #d4d4d8;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  main {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 0.25rem;
  }
  p.basebux {
    color: var(--muted);
    margin: 0 0 1.5rem;
    font-size: 0.95rem;
  }
  #menuButtons {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  button {
    padding: 0.75rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
  }
  button:hover { filter: brightness(0.95); }
  button.secondary {
    background: var(--panel);
    color: var(--text);
    border-color: var(--border);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #232326;
      --border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
  }
</style>
</head>
<body>
<main>
  <h1>rngbaseball</h1>
  <p class="basebux" id="basebuxLine"></p>
  <div id="menuButtons">
    <button id="seasonBtn" type="button"></button>
    <button id="newSeasonBtn" type="button" class="secondary" style="display:none;">New Season</button>
    <button id="freshStartBtn" type="button" class="secondary">Fresh Start</button>
    <button id="loadoutsBtn" type="button" class="secondary">Loadouts</button>
  </div>
</main>

<script src="season.js"></script>
<script>
  const seasonBtn = document.getElementById("seasonBtn");
  const newSeasonBtn = document.getElementById("newSeasonBtn");
  const freshStartBtn = document.getElementById("freshStartBtn");
  const loadoutsBtn = document.getElementById("loadoutsBtn");

  function render() {
    const save = getSave();
    const hasSeason = !!(save && save.seasonInProgress);
    seasonBtn.textContent = hasSeason ? "Continue Season" : "Start Season";
    newSeasonBtn.style.display = hasSeason ? "block" : "none";
    document.getElementById("basebuxLine").textContent = `Basebux: ${getMeta().basebux}`;
  }

  seasonBtn.addEventListener("click", () => {
    const save = getSave();
    if (save && save.seasonInProgress) {
      window.location.href = "season.html";
    } else {
      window.location.href = "league-select.html";
    }
  });

  newSeasonBtn.addEventListener("click", () => {
    const confirmed = confirm("Start a new season? This erases your current season's progress. Your unlocked leagues stay unlocked.");
    if (!confirmed) return;

    // Anything currently equipped belongs to a roster this season won't
    // control anymore -- return it to inventory rather than losing it.
    const oldSave = getSave();
    if (oldSave && oldSave.equippedGear) {
      const meta = getMeta();
      Object.values(oldSave.equippedGear).forEach(slots => {
        Object.values(slots).forEach(item => { if (item) meta.inventory.push(item); });
      });
      setMeta(meta);
    }

    clearSave();
    render();
  });

  freshStartBtn.addEventListener("click", () => {
    const confirmed = confirm("Fresh start? This erases your current season AND all league progress, resetting you back to Rookie league only.");
    if (!confirmed) return;
    clearSave();
    clearMeta();
    render();
  });

  loadoutsBtn.addEventListener("click", () => {
    const save = getSave();
    if (save && save.seasonInProgress) {
      window.location.href = "loadouts.html";
    } else {
      alert("Start a season first -- loadouts are equipped onto your season roster.");
    }
  });

  render();
</script>
</body>
</html>
