<!--
  play.html
  -----------------------------------------------------------------------------
  Placeholder game screen -- reached via "Start/Continue Season" on the main
  menu (index.html). This is still just the single-instant-game test screen:
  pick two teams, simulate one full 9-inning game, show the play-by-play.

  This gets replaced by the real season loop (schedule, standings, playoff)
  later; the menu doesn't need to change when that happens, since it just
  links here.
  -----------------------------------------------------------------------------
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rngbaseball</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --panel: #ffffff;
    --border: #d4d4d8;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin-bottom: 1rem; }
  .back-row { margin-bottom: 1rem; }
  .back-btn {
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .back-btn:hover { filter: brightness(0.95); }
  .setup-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 1rem;
  }
  select {
    flex: 1;
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  button {
    padding: 0.55rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .scoreboard {
    display: flex;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    margin-bottom: 1rem;
    font-size: 1.1rem;
    font-weight: 600;
  }
  #playLog {
    height: 40vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    background: var(--panel);
    margin-bottom: 1rem;
  }
  .inning-header {
    font-weight: 700;
    margin-top: 0.9rem;
    color: var(--accent);
  }
  .inning-header:first-child { margin-top: 0; }
  .play-line {
    font-size: 0.9rem;
    padding: 0.15rem 0;
    color: var(--text);
  }
  #boxScore {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    background: var(--panel);
    margin-bottom: 1rem;
  }
  table.box-score-table {
    border-collapse: collapse;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  table.box-score-table th, table.box-score-table td {
    text-align: center;
    padding: 0.2rem 0.5rem;
  }
  table.box-score-table td:first-child, table.box-score-table th:first-child {
    text-align: left;
  }
  table.box-score-table th {
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  table.box-score-table td.totals {
    font-weight: 700;
    border-left: 1px solid var(--border);
  }
  #statsPane {
    height: 35vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    background: var(--panel);
  }
  .stats-team-header {
    font-weight: 700;
    margin-top: 0.9rem;
    color: var(--accent);
  }
  .stats-team-header:first-child { margin-top: 0; }
  table.stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin-top: 0.3rem;
  }
  table.stats-table th, table.stats-table td {
    text-align: left;
    padding: 0.2rem 0.4rem;
  }
  table.stats-table th {
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --panel: #232326;
      --border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
  }
</style>
</head>
<body>
<main>
  <div class="back-row"><button type="button" class="back-btn" onclick="window.location.href='index.html'">&larr; Main Menu</button></div>
  <h1>rngbaseball</h1>

  <div class="setup-row">
    <select id="teamASelect"></select>
    <span>vs</span>
    <select id="teamBSelect"></select>
    <button id="playBtn" disabled>Play Game</button>
    <button id="skipBtn" style="display:none;">Skip to End</button>
  </div>

  <div class="scoreboard" id="scoreboard" style="display:none;"></div>
  <div id="boxScore" style="display:none;"></div>

  <div id="playLog"></div>
  <div id="statsPane"></div>
</main>

<script src="engine.js"></script>
<script>
  let teams = [];

  const teamASelect = document.getElementById("teamASelect");
  const teamBSelect = document.getElementById("teamBSelect");
  const playBtn = document.getElementById("playBtn");
  const scoreboard = document.getElementById("scoreboard");
  const playLog = document.getElementById("playLog");

  async function loadTeams() {
    const res = await fetch("../data/teams.json");
    const data = await res.json();
    teams = data.teams;
    [teamASelect, teamBSelect].forEach((select, i) => {
      select.innerHTML = teams.map((t, idx) => `<option value="${idx}">${t.name}</option>`).join("");
      select.value = i === 0 ? 0 : 1;
    });
    playBtn.disabled = false;
  }

  const statsPane = document.getElementById("statsPane");
  const boxScore = document.getElementById("boxScore");
  const skipBtn = document.getElementById("skipBtn");

  let revealToken = 0; // bumped to cancel an in-progress reveal (e.g. Skip pressed)

  playBtn.addEventListener("click", () => {
    const teamA = teams[teamASelect.value];
    const teamB = teams[teamBSelect.value];
    const result = simulateGame(teamA, teamB);
    revealGame(result, teamA, teamB);
  });

  skipBtn.addEventListener("click", () => {
    revealToken++; // cancels any pending timers from the in-progress reveal
    skipBtn.style.display = "none";
    if (skipBtn._result) renderFinal(skipBtn._result, skipBtn._teamA, skipBtn._teamB);
  });

  async function revealGame(result, teamA, teamB) {
    const myToken = ++revealToken;
    playLog.innerHTML = "";
    scoreboard.style.display = "flex";
    boxScore.style.display = "block";
    skipBtn.style.display = "inline-block";
    skipBtn._result = result;
    skipBtn._teamA = teamA;
    skipBtn._teamB = teamB;

    let lastHalf = null, lastInning = null;
    const inningRuns = {}; // "top-3" -> runs, filled in/updated as plays happen
    let halfStartA = 0, halfStartB = 0; // cumulative score at the moment this half-inning began
    let prevScoreA = 0, prevScoreB = 0; // cumulative score as of the previous play in this loop

    for (const play of result.plays) {
      if (myToken !== revealToken) return; // Skip to End was pressed

      if (play.half !== lastHalf || play.inning !== lastInning) {
        // A new half-inning is starting: the baseline is wherever the score
        // stood after the *previous* play (not this one), since this play
        // hasn't been credited yet.
        halfStartA = prevScoreA;
        halfStartB = prevScoreB;
        lastHalf = play.half;
        lastInning = play.inning;
        const label = `${play.half === "top" ? "Top" : "Bottom"} ${play.inning} — ${play.half === "top" ? teamA.name : teamB.name}`;
        playLog.insertAdjacentHTML("beforeend", `<div class="inning-header">${escapeHtml(label)}</div>`);
      }

      playLog.insertAdjacentHTML("beforeend", `<div class="play-line">${escapeHtml(play.text)}</div>`);
      playLog.scrollTop = playLog.scrollHeight;

      scoreboard.innerHTML = `<span>${teamA.name}: ${play.scoreA}</span><span>${teamB.name}: ${play.scoreB}</span>`;

      const key = `${play.half}-${play.inning}`;
      inningRuns[key] = play.half === "top" ? play.scoreA - halfStartA : play.scoreB - halfStartB;
      prevScoreA = play.scoreA;
      prevScoreB = play.scoreB;

      renderBoxScoreLive(result, teamA, teamB, inningRuns, play);
      renderStats(play.stats, teamA, teamB);

      await new Promise(r => setTimeout(r, 100 + Math.random() * 200));
    }

    playLog.insertAdjacentHTML("beforeend",
      `<div class="inning-header">Final: ${teamA.name} ${result.scoreA}, ${teamB.name} ${result.scoreB} — ${result.winner} wins</div>`);
    skipBtn.style.display = "none";
  }

  function renderFinal(result, teamA, teamB) {
    scoreboard.style.display = "flex";
    scoreboard.innerHTML = `<span>${teamA.name}: ${result.scoreA}</span><span>${teamB.name}: ${result.scoreB}</span>`;

    playLog.innerHTML = result.innings.map(inn => `
      <div class="inning-header">Top ${inn.inning} — ${teamA.name}</div>
      ${inn.top.log.map(line => `<div class="play-line">${escapeHtml(line)}</div>`).join("")}
      <div class="inning-header">Bottom ${inn.inning} — ${teamB.name}</div>
      ${inn.bottom.log.map(line => `<div class="play-line">${escapeHtml(line)}</div>`).join("")}
    `).join("");
    playLog.innerHTML += `<div class="inning-header">Final: ${teamA.name} ${result.scoreA}, ${teamB.name} ${result.scoreB} — ${result.winner} wins</div>`;

    boxScore.style.display = "block";
    renderBoxScoreFinal(result, teamA, teamB);
    renderStats(result.stats, teamA, teamB);
  }

  function renderBoxScoreFinal(result, teamA, teamB) {
    const totalInnings = result.innings.length;
    const teamAHits = sumTeamHits(result.stats, teamA);
    const teamBHits = sumTeamHits(result.stats, teamB);
    boxScore.innerHTML = `
      <table class="box-score-table">
        <tr><th>Team</th>${result.innings.map(i => `<th>${i.inning}</th>`).join("")}<th class="totals">R</th><th class="totals">H</th><th class="totals">E</th></tr>
        <tr><td>${escapeHtml(teamA.name)}</td>${result.innings.map(i => `<td>${i.top.log[0] === "(not needed -- game already decided)" ? "-" : i.top.runs}</td>`).join("")}<td class="totals">${result.scoreA}</td><td class="totals">${teamAHits}</td><td class="totals">${result.errors.A}</td></tr>
        <tr><td>${escapeHtml(teamB.name)}</td>${result.innings.map(i => `<td>${i.bottom.log[0] === "(not needed -- game already decided)" ? "-" : i.bottom.runs}</td>`).join("")}<td class="totals">${result.scoreB}</td><td class="totals">${teamBHits}</td><td class="totals">${result.errors.B}</td></tr>
      </table>
    `;
  }

  function renderBoxScoreLive(result, teamA, teamB, inningRuns, currentPlay) {
    const totalInnings = result.innings.length;
    const teamAHits = sumTeamHits(currentPlay.stats, teamA);
    const teamBHits = sumTeamHits(currentPlay.stats, teamB);
    const cell = (half, inning) => {
      const value = inningRuns[`${half}-${inning}`];
      return value !== undefined ? value : "";
    };
    boxScore.innerHTML = `
      <table class="box-score-table">
        <tr><th>Team</th>${result.innings.map(i => `<th>${i.inning}</th>`).join("")}<th class="totals">R</th><th class="totals">H</th><th class="totals">E</th></tr>
        <tr><td>${escapeHtml(teamA.name)}</td>${result.innings.map(i => `<td>${cell("top", i.inning)}</td>`).join("")}<td class="totals">${currentPlay.scoreA}</td><td class="totals">${teamAHits}</td><td class="totals">${currentPlay.errors.A}</td></tr>
        <tr><td>${escapeHtml(teamB.name)}</td>${result.innings.map(i => `<td>${cell("bottom", i.inning)}</td>`).join("")}<td class="totals">${currentPlay.scoreB}</td><td class="totals">${teamBHits}</td><td class="totals">${currentPlay.errors.B}</td></tr>
      </table>
    `;
  }

  function sumTeamHits(stats, team) {
    return team.lineup.reduce((sum, p) => sum + (stats[p.name] ? stats[p.name].batting.H : 0), 0);
  }

  function renderStats(stats, teamA, teamB) {
    statsPane.innerHTML = [teamA, teamB].map(team => `
      <div class="stats-team-header">${escapeHtml(team.name)}</div>
      <table class="stats-table">
        <tr><th>Player</th><th>Pos</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>BB</th><th>K</th><th>R</th><th>AVG</th></tr>
        ${team.lineup.map(p => {
          const line = stats[p.name].batting;
          return `<tr>
            <td>${escapeHtml(p.name)}</td><td>${p.position}</td>
            <td>${line.AB}</td><td>${line.H}</td><td>${line.doubles}</td><td>${line.triples}</td><td>${line.HR}</td>
            <td>${line.BB}</td><td>${line.K}</td><td>${line.R}</td><td>${battingAverage(line).toFixed(3)}</td>
          </tr>`;
        }).join("")}
      </table>
      <table class="stats-table">
        <tr><th>Pitcher</th><th>IP</th><th>H</th><th>BB</th><th>K</th><th>R</th><th>ERA</th></tr>
        ${(() => {
          const p = findPitcher(team);
          const line = stats[p.name].pitching;
          return `<tr>
            <td>${escapeHtml(p.name)}</td><td>${(line.outs / 3).toFixed(1)}</td>
            <td>${line.H}</td><td>${line.BB}</td><td>${line.K}</td><td>${line.R}</td><td>${era(line).toFixed(2)}</td>
          </tr>`;
        })()}
      </table>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadTeams();
</script>
</body>
</html>
